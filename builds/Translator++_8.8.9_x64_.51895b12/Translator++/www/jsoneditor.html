<style>
    #jsoneditor {
        width:100vw;
        height: calc(100vh - 32px);
    }
</style>
<title>Object viewer - Translator++</title>

<head>

<body data-window="jsoneditor">

<div class="toolbar">
	<div class="toolbar-content toolbar1">
		<select id="noteColor" title="Note's color">
			<option value="">-Default-</option>
		</select>
	</div>
	<div class="toolbar-content toolbar2">
		<button class="menu-button addNote" data-tranattr="title" title="Remove note">
			<i class="icon-trash-empty" id="clearNote"></i>
		</button> 
	</div>
</div>
<div id="jsoneditor"></div>
<link href="modules/jsoneditor/dist/jsoneditor.min.css" rel="stylesheet" type="text/css">
<script src="modules/jsoneditor/dist/jsoneditor.min.js"></script>    
<script>
    const trans = window.opener.trans;
    // create the editor
    const container = document.getElementById("jsoneditor")
    const options = {
        mode:'view',
        modes:['tree', 'view', 'form', 'code', 'text', 'preview']
    }
    const editor = new JSONEditor(container, options)

    // set json
    const initialJson = {
        trans: {
            project: common.clone(trans.project)
        }
    }
    editor.set(initialJson)

    // get json
    const updatedJson = editor.get()
</script>
</body>
</html>
