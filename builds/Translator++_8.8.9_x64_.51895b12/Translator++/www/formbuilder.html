<title>Form Builder - Translator++</title>

<head>

<body data-window="formBuilder" class="bs5">
    <nav>
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
            <button class="nav-link active" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-home" type="button" role="tab" aria-controls="nav-home" aria-selected="true">Builder</button>
            <button class="nav-link" id="nav-preview-tab" data-bs-toggle="tab" data-bs-target="#nav-preview" type="button" role="tab" aria-controls="nav-preview" aria-selected="false">Preview</button>
            <button class="nav-link" id="nav-json-tab" data-bs-toggle="tab" data-bs-target="#nav-json" type="button" role="tab" aria-controls="nav-json" aria-selected="false">JSON Schema</button>
            <button class="nav-link" id="nav-converter-tab" data-bs-toggle="tab" data-bs-target="#nav-converter" type="button" role="tab" aria-controls="nav-converter" aria-selected="false">Convert</button>
        </div>
    </nav>
    <div class="tab-content" id="nav-tabContent">
        <div class="tab-pane fade show active" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab">
            <nav class="topnavbar navbar navbar-light">
                <label>Form mode: 
                    <select class="form-control" id="form-select" style="display: inline-block; width: 150px;">
                        <option value="form">Form</option>
                        <option value="wizard">Wizard</option>
                    </select>
                </label>
            </nav>

            <div id="builder"></div>
        </div>
        <div class="tab-pane fade" id="nav-preview" role="tabpanel" aria-labelledby="nav-preview-tab">
            <div class="card card-body" id="previewPane">
                <div>
                    <nav class="navbar navbar-light justify-content-between">
                        <a class="navbar-brand">Preview form</a>
                        <div class="form-inline">
                          <button id="submitPreview" class="btn btn-outline-success my-2 my-sm-0">Submit form</button>
                        </div>
                    </nav>
                    <div id="formio"></div>
                </div>
                <div>
                    <nav class="navbar navbar-light justify-content-between">
                        <a class="navbar-brand">Submitted Data</a>
                    </nav>
                    <div id="submittedJson"></div>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="nav-json" role="tabpanel" aria-labelledby="nav-json-tab">
            <!-- <nav class="navbar navbar-light justify-content-between">
                <a class="navbar-brand">JSON Schema</a>
                <div class="form-inline">
                  <button id="updateJsonSchema" class="btn btn-outline-success my-2 my-sm-0">Save change</button>
                </div>
            </nav> -->
            <div id="jsonSchema"></div>
        </div>
        <div class="tab-pane fade" id="nav-converter" role="tabpanel" aria-labelledby="nav-converter-tab">
            <nav class="navbar navbar-light justify-content-between">
                <a class="navbar-brand">JSONForm Schema</a>
                <div class="form-inline">
                    <button id="generateJSONForm" class="btn btn-outline-info my-2 my-sm-0">Generate JSONFORM</button>
                    <button id="importJSONForm" class="btn btn-outline-success my-2 my-sm-0">Import from JSONFORM</button>
                </div>
            </nav>
            <div id="jsonFormSchema"></div>
        </div>
    </div>
    <nav id="footer" class="footer navbar navbar-light justify-content-between">
        <div class="navbar-brand"></div>
        <div class="form-inline">
            <button class="btn btn btn-outline-danger btn-lg" id="clear">Clear</button>
            <button class="btn btn btn-outline-danger btn-lg" id="reset">Reset</button>
            <button class="btn btn-primary my-2 my-sm-0 btn-lg" id="submit">Submit</button>
        </div>
    </nav>
